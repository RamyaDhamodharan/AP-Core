[project]
name = "genworx-ap-core-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.1.0",
  "alembic>=1.13.0",
  "celery>=5.3.0",
  "redis>=5.0.0",
  "boto3>=1.34.0",
  "PyJWT",
  "email-validator",
  "minio>=7.2.0",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
documents = ["docling"]
dev = ["pytest", "httpx", "ruff", "mypy"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C4"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
no_implicit_optional = true
